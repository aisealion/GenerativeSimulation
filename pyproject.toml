[project]
name = "generative-simulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # litellm/pydantic pinned together deliberately: litellm's response types
    # use pydantic forward references that need a matching pydantic to
    # resolve (an unpinned litellm picking up a container's older pre-baked
    # pydantic raises "Message is not fully defined ... call
    # Message.model_rebuild()" before any request is even sent). This exact
    # pair is verified working end-to-end (Aoraki HPC hit this failure
    # 2026-08-19 with an unpinned install).
    "litellm==1.97.0",
    "pydantic==2.13.4",
    "python-dotenv",
    "graphiti-core",
]
